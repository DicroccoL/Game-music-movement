<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Juego Ritmo</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="layout">

    <!-- PANEL IZQUIERDO -->
    <div id="song-panel">

        <h2>Temas</h2>

        <button class="preset-song"
            data-song="SONGS/Rock That Body.mp3">
            Rock That Body
        </button>

        <button class="preset-song"
            data-song="SONGS/Veridis Quo [POSwzCFwUZ0] (1).mp3">
            Veridis Quo
        </button>

        <input type="file" id="music-input" accept="audio/mp3">

    </div>


<div id="container">

    <p id="song-name">
      Ninguna canción seleccionada
    </p>

    <p id="song-time">
    0:00 / 0:00
    </p>

    <p id="score">
     POINTS: <span>0</span>
    </p>
    

    <div id="game-container"></div>
    
     <label for="music-input" id="music-button">
            Subir canción
        </label>

</div>


<div id="cursor"></div>
<canvas id="trail-canvas"></canvas>
<script src="script.js"></script>

</body>
</html>
